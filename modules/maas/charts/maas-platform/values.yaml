# RHOAI 3.4 auto-creates DSCI when the operator starts.
# With ArgoCD, set to true to declaratively manage DSCI (ArgoCD adopts the resource).
# With Helm install, set to false (operator auto-creates it, Helm can't adopt).
dsci:
  managed: true

datasciencecluster:
  name: default-dsc
  components:
    dashboard:
      managementState: Managed
    kserve:
      managementState: Managed
      rawDeploymentServiceConfig: Headed
      wva:
        managementState: Removed
    llamastackoperator:
      managementState: Managed
    modelsAsService:
      managementState: Managed
    aipipelines:
      managementState: Removed
    feastoperator:
      managementState: Removed
    kueue:
      managementState: Removed
    mlflowoperator:
      managementState: Managed
    modelregistry:
      managementState: Removed
      registriesNamespace: rhoai-model-registries
    ray:
      managementState: Removed
    trainer:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    trustyai:
      managementState: Managed
      eval:
        lmeval:
          # allow: benchmarks can execute LLM-generated code (needed for HumanEval-type evals)
          # deny: blocks code execution (safer, sufficient for MMLU/HellaSwag/etc.)
          permitCodeExecution: deny
          # allow: evaluations can download datasets from HuggingFace during execution
          # deny: air-gapped evaluations (requires datasets pre-loaded in the cluster)
          permitOnline: allow
    sparkoperator:
      managementState: Removed
    workbenches:
      managementState: Removed

dashboard:
  # The auto-created OdhDashboardConfig lacks MaaS/GenAI flags; manage it via Helm/ArgoCD.
  # Requires dashboard CRD (available after DSC with dashboard: Managed reconciles).
  # ArgoCD handles CRD ordering via SkipDryRunOnMissingResource annotation on the template.
  crEnabled: true
  genAiStudio: true
  modelAsService: true
  maasAuthPolicies: true
  vLLMDeploymentOnMaaS: true
  observabilityDashboard: true   # TP: requires Cluster Observability Operator (COO) -- see ADR-0013
  mlflow: true                   # Dev Preview: shows MLflow tile on Applications → Explore
  disablePerformanceMetrics: false  # shows Endpoint Performance tab on Deployments page
  disableModelCatalog: false     # shows AI hub → Catalog menu item
  disableModelRegistry: true     # shows AI hub → Registry menu item
  disableLLMd: false             # shows llm-d distributed inference option in model serving wizard

gateway:
  enabled: true
  name: maas-default-gateway
  namespace: openshift-ingress
  className: data-science-gateway-class
  # Kubernetes Service type for the Envoy proxy created by the Gateway.
  # ClusterIP (default): traffic enters via the OpenShift Route.
  # LoadBalancer: for clusters with a cloud LB controller (AWS, GCP, etc.).
  serviceType: ClusterIP
  authPolicyName: maas-default-gateway-authn
  # TLS secret for the Gateway listener.
  # passthrough mode (default): use the cluster wildcard cert
  #   bare-metal: router-certs-default
  #   AWS: ingress-certs
  # reencrypt mode: use a service-ca generated cert
  #   annotate the gateway svc with service.beta.openshift.io/serving-cert-secret-name
  #   e.g. maas-gateway-service-tls
  tlsSecretName: ingress-certs
  # Gateway listener hostname (e.g. maas.apps.cluster.example.com).
  # Required for RHOAI dashboard API keys UI (maas-ui auto-discovers this).
  # Must match route.host. Uses wildcard DNS/cert: *.apps.<clusterDomain>.
  hostname: ""
  modelNamespaces: []

route:
  enabled: true
  name: maas-default-gateway
  namespace: openshift-ingress
  # Custom hostname for the Route (e.g. maas.apps.cluster.example.com).
  # Leave empty to let OpenShift generate a default hostname.
  host: ""
  # passthrough (default): TLS goes directly from client to Gateway.
  #   Requires gateway.tlsSecretName to be the wildcard cert for *.apps.<clusterDomain>.
  # reencrypt: router terminates external TLS, re-encrypts to Gateway with service-ca cert.
  #   Requires gateway.tlsSecretName to be a service-ca cert + annotation on the svc.
  tlsTermination: passthrough

# Limitador configuration
limitador:
  # Enables limit_name labels on authorized metrics (not just limited_calls)
  exhaustiveTelemetry: true
  # HA requires shared storage (redis/redis-cached). With in-memory (default),
  # each replica has independent counters — effective rate limit scales with replicas.
  # See ROADMAP.md for Redis storage plan.
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# OpenShift Groups for MaaSSubscription tiers.
# Groups listed here are created as OpenShift Group CRs (except built-in ones).
# maas-test-users: dedicated group for E2E tests (conftest.py auto-adds the logged-in user)
tiers:
  - name: free
    groups:
      - name: maas-test-users

  - name: premium
    groups:
      - name: tier-premium-users
        users: []

# Tenant CR: auto-created by maas-controller, but we manage spec.telemetry via SSA.
# ArgoCD (enabled: true): template + ServerSideApply merges with controller's Tenant.
# Helm (enabled: false): Makefile does `oc patch` after deploy instead.
tenant:
  enabled: true
  gatewayRef:
    name: maas-default-gateway
    namespace: openshift-ingress
  telemetry:
    enabled: true
    metrics:
      captureOrganization: true
      captureUser: true
      captureGroup: false
      captureModelUsage: true

# ServiceMonitor for Limitador metrics scraping
monitoring:
  enabled: true
  scrapeInterval: 30s
  vllm:
    enabled: true
    modelNamespace: models-as-a-service
  # kube-state-metrics with CustomResourceState for Gateway API + Kuadrant CRs
  gatewayMetrics:
    enabled: true
    namespace: observability

# PrometheusRule alerts for rate limit health
alerting:
  enabled: true
  rejectionRateThreshold: 0.3

# GrafanaDashboard CRs (requires Grafana Operator CRDs)
grafana:
  enabled: false
  instanceSelector:
    dashboards: "grafana"

# Operator CRs -- applied here (not in operators chart) so ArgoCD manages them
# as regular resources with self-heal. The CRDs are installed by the operators chart
# (ArgoCD sync-wave 0); this chart runs at sync-wave 1.
kuadrant:
  enabled: true
  namespace: kuadrant-system
  # Namespace where RHCL operator pod runs (for restart on Istio race condition)
  operatorNamespace: redhat-connectivity-link
  observability: true
  # Authorino TLS PostSync Job: manually configures TLS on Authorino (cert, CA bundle,
  # volume mounts, SSL_CERT_FILE). The Gateway annotation
  # `security.opendatahub.io/authorino-tls-bootstrap: "true"` tells the RHOAI MaaS
  # controller to handle this automatically. Enable only for llm-d or if the
  # automatic bootstrap is insufficient.
  authorinoTls:
    enabled: true
  # Authorino replicas and resource limits: the Authorino CRD (v1beta2) supports
  # spec.replicas but NOT spec.resources. Patching the Deployment directly from
  # a PostSync Job is fragile (operator can revert on reconciliation).
  # Re-evaluate when the Authorino operator adds resource configuration to the CR.
  # Tracked: https://github.com/Kuadrant/authorino-operator/issues — watch for
  # spec.resources or spec.containers[].resources support.

leaderWorkerSet:
  enabled: true

