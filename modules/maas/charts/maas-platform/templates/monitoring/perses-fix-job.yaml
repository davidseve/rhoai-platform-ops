{{- if (ne (.Values.dsci.managed | toString) "false") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: perses-fix
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: perses-fix
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: perses-fix
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perses-fix
subjects:
- kind: ServiceAccount
  name: perses-fix
  namespace: redhat-ods-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: perses-fix-operator
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: perses-fix-operator
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perses-fix-operator
subjects:
- kind: ServiceAccount
  name: perses-fix
  namespace: redhat-ods-monitoring
---
apiVersion: batch/v1
kind: Job
metadata:
  name: perses-fix
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: perses-fix
      restartPolicy: OnFailure
      containers:
      - name: fix
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "=== RHOAI 3.4.0 Monitoring Workarounds ==="

          echo "Step 1: Ensure prometheus-web-tls-ca Secret exists..."
          if ! oc get secret prometheus-web-tls-ca -n redhat-ods-monitoring 2>/dev/null; then
            echo "  Creating empty TLS CA secret..."
            oc create secret generic prometheus-web-tls-ca -n redhat-ods-monitoring
          else
            echo "  Secret already exists"
          fi

          echo "Step 2: Wait for Perses StatefulSet..."
          for i in $(seq 1 60); do
            if oc get statefulset data-science-perses -n redhat-ods-monitoring 2>/dev/null; then
              echo "  StatefulSet found"
              break
            fi
            echo "  waiting ($i/60)..."
            sleep 5
          done

          echo "Step 3: Check if Perses has TLS flag bug..."
          ARGS=$(oc get statefulset data-science-perses -n redhat-ods-monitoring \
            -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null || echo "")
          if echo "$ARGS" | grep -q 'tls-min-version'; then
            echo "  TLS flag bug detected — fixing..."

            echo "  Scaling down Perses operator..."
            oc scale deployment perses-operator -n openshift-operators --replicas=0

            echo "  Waiting for operator to stop..."
            for i in $(seq 1 12); do
              READY=$(oc get deployment perses-operator -n openshift-operators \
                -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "1")
              if [ "$READY" = "" ] || [ "$READY" = "0" ]; then
                echo "  Operator stopped"
                break
              fi
              sleep 5
            done

            echo "  Patching StatefulSet to remove TLS flags..."
            oc patch statefulset data-science-perses -n redhat-ods-monitoring \
              --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/args","value":["--config=/etc/perses/config/config.yaml","--web.listen-address=:8080"]}]'

            echo "  Restarting Perses pod..."
            oc delete pod data-science-perses-0 -n redhat-ods-monitoring --ignore-not-found

            echo "  Waiting for Perses to be Ready..."
            for i in $(seq 1 30); do
              READY=$(oc get pod data-science-perses-0 -n redhat-ods-monitoring \
                -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
              if [ "$READY" = "true" ]; then
                echo "  Perses Ready"
                break
              fi
              sleep 5
            done

            DASHBOARD_CRS=$(oc get persesdashboard -A --no-headers 2>/dev/null | wc -l | tr -d ' ')
            if [ "$DASHBOARD_CRS" -gt 0 ]; then
              echo "  Scaling up Perses operator to sync $DASHBOARD_CRS dashboard CRs..."
              oc scale deployment perses-operator -n openshift-operators --replicas=1

              PERSES_SVC="http://data-science-perses.redhat-ods-monitoring.svc:8080"
              echo "  Waiting for dashboards in Perses API (up to 90s)..."
              for i in $(seq 1 18); do
                sleep 5
                API_COUNT=$(curl -sf "$PERSES_SVC/api/v1/dashboards" 2>/dev/null \
                  | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
                echo "  dashboards in API: $API_COUNT / CRs: $DASHBOARD_CRS ($i/18)"
                if [ "$API_COUNT" -ge "$DASHBOARD_CRS" ]; then
                  echo "  All dashboards synced"
                  break
                fi
              done

              echo "  Scaling down operator (prevent TLS revert)..."
              oc scale deployment perses-operator -n openshift-operators --replicas=0
              sleep 5
            else
              echo "  No PersesDashboard CRs found — skipping operator sync"
            fi

            echo "  Re-patching StatefulSet if operator reverted..."
            ARGS_AFTER=$(oc get statefulset data-science-perses -n redhat-ods-monitoring \
              -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null || echo "")
            if echo "$ARGS_AFTER" | grep -q 'tls-min-version'; then
              oc patch statefulset data-science-perses -n redhat-ods-monitoring \
                --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/args","value":["--config=/etc/perses/config/config.yaml","--web.listen-address=:8080"]}]'
            fi

            PERSES_STATUS=$(oc get pod data-science-perses-0 -n redhat-ods-monitoring \
              -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
            if [ "$PERSES_STATUS" != "true" ]; then
              echo "  Perses not ready — restarting..."
              oc delete pod data-science-perses-0 -n redhat-ods-monitoring --ignore-not-found
              echo "  Waiting for Perses to come back..."
              for i in $(seq 1 20); do
                sleep 5
                READY=$(oc get pod data-science-perses-0 -n redhat-ods-monitoring \
                  -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
                if [ "$READY" = "true" ]; then
                  echo "  Perses Ready"
                  break
                fi
              done
            fi
          else
            echo "  No TLS flag bug (3.4.1+ or already fixed)"
          fi

          echo "Step 4: Verify Perses is healthy..."
          READY=$(oc get pod data-science-perses-0 -n redhat-ods-monitoring \
            -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
          echo "  Perses ready: $READY"

          echo "=== Monitoring workarounds complete ==="
{{- end }}
