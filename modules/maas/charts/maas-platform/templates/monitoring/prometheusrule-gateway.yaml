{{- if .Values.alerting.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: maas-gateway-alerts
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: maas-gateway-errors
      rules:
        - alert: MaaSGatewayAuthTimeout
          expr: |
            sum(rate(kuadrant_errors[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "MaaS gateway WASM filter errors"
            description: "The Kuadrant WASM filter is reporting errors at {{ "{{ $value | humanize }}" }} req/s. Check Limitador and auth pipeline health."

        - alert: MaaSBackend5xx
          expr: |
            sum(rate(istio_requests_total{source_workload="{{ .Values.gateway.name }}-{{ .Values.gateway.className }}", response_code=~"5.."}[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "MaaS backend returning 5xx errors"
            description: "vLLM or backend services are returning server errors at {{ "{{ $value | humanize }}" }} req/s through the MaaS gateway."

        - alert: MaaSGatewayErrorsCritical
          expr: |
            (
              sum(rate(kuadrant_errors[5m]))
              + sum(rate(istio_requests_total{source_workload="{{ .Values.gateway.name }}-{{ .Values.gateway.className }}", response_code=~"5.."}[5m]))
            ) / (
              sum(rate(kuadrant_allowed[5m]))
              + sum(rate(kuadrant_denied[5m]))
              + sum(rate(kuadrant_errors[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "MaaS total error rate exceeds 5%"
            description: "More than 5% of all gateway requests are failing (auth timeouts + backend errors combined)."

    - name: maas-gateway-hardening
      rules:
        - alert: MaaSAuthTimeoutRateHigh
          expr: |
            sum(rate(kuadrant_errors[5m]))
            / (
              sum(rate(kuadrant_allowed[5m]))
              + sum(rate(kuadrant_denied[5m]))
              + sum(rate(kuadrant_errors[5m]))
            ) > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "MaaS auth timeout rate exceeds 1%"
            description: "Auth pipeline errors (WASM 200ms timeout) exceed 1% of total requests. Authorino may need more CPU or replicas."

        - alert: MaaSAuthorinoCPUSaturation
          expr: |
            max(
              rate(container_cpu_usage_seconds_total{namespace="{{ .Values.kuadrant.namespace }}", pod=~"authorino-.*", container="authorino"}[5m])
              / on(pod) group_left()
              kube_pod_container_resource_limits{namespace="{{ .Values.kuadrant.namespace }}", pod=~"authorino-.*", container="authorino", resource="cpu"}
            ) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Authorino CPU usage exceeds 80% of limit"
            description: "Authorino pod CPU is above 80% of its limit. Auth evaluations risk exceeding the 200ms WASM timeout under load."
{{- end }}
