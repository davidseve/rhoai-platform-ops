{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  annotations:
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
    networking.istio.io/service-type: {{ .Values.gateway.serviceType | default "ClusterIP" }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    {{- if .Values.gateway.hostname }}
    hostname: {{ .Values.gateway.hostname }}
    {{- end }}
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: {{ .Values.gateway.tlsSecretName }}
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
            - {{ .Values.gateway.namespace }}
            - redhat-ods-applications
            - models-as-a-service
            {{- range .Values.gateway.modelNamespaces }}
            - {{ . }}
            {{- end }}
{{- end }}
