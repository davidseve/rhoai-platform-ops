{{- if and .Values.kuadrant.enabled .Values.kuadrant.authorinoTls.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
- apiGroups: ["operator.authorino.kuadrant.io"]
  resources: ["authorinos"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authorino-tls-setup
subjects:
- kind: ServiceAccount
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: authorino-tls-setup
      restartPolicy: OnFailure
      containers:
      - name: setup
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          NAMESPACE="{{ .Values.kuadrant.namespace }}"

          echo "Step 1: Annotate Authorino service for serving cert..."
          oc annotate service authorino-authorino-authorization \
            -n "$NAMESPACE" \
            service.beta.openshift.io/serving-cert-secret-name=authorino-server-cert \
            --overwrite

          echo "Step 2: Wait for cert secret..."
          for i in $(seq 1 30); do
            if oc get secret authorino-server-cert -n "$NAMESPACE" 2>/dev/null; then
              echo "  cert secret found"
              break
            fi
            echo "  waiting ($i/30)..."
            sleep 2
          done

          echo "Step 3: Check if service-ca ConfigMap exists..."
          if ! oc get configmap openshift-service-ca.crt -n "$NAMESPACE" 2>/dev/null; then
            echo "  WARNING: openshift-service-ca.crt ConfigMap not found. Creating..."
            oc create configmap openshift-service-ca.crt -n "$NAMESPACE" || true
            oc annotate configmap openshift-service-ca.crt -n "$NAMESPACE" \
              service.beta.openshift.io/inject-cabundle=true --overwrite
            sleep 5
          fi

          echo "Step 4: Add service-ca volume to Authorino deployment..."
          DEPLOY=$(oc get deploy authorino -n "$NAMESPACE" -o jsonpath='{.metadata.name}' 2>/dev/null || echo "")
          if [ -z "$DEPLOY" ]; then
            echo "  ERROR: Authorino deployment not found"
            exit 1
          fi

          HAS_VOLUME=$(oc get deploy authorino -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.volumes[?(@.name=="openshift-service-ca")].name}' 2>/dev/null || echo "")

          if [ -z "$HAS_VOLUME" ]; then
            echo "  Adding openshift-service-ca volume..."
            oc set volume deploy/authorino -n "$NAMESPACE" --add \
              --name=openshift-service-ca \
              --type=configmap \
              --configmap-name=openshift-service-ca.crt \
              --mount-path=/etc/ssl/certs/openshift-service-ca \
              --read-only
          else
            echo "  Volume already exists, skipping"
          fi

          echo "Step 5: Set SSL_CERT_FILE env var..."
          CURRENT_CERT=$(oc get deploy authorino -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="SSL_CERT_FILE")].value}' 2>/dev/null || echo "")

          if [ "$CURRENT_CERT" != "/etc/ssl/certs/openshift-service-ca/service-ca.crt" ]; then
            echo "  Setting SSL_CERT_FILE..."
            oc set env deploy/authorino -n "$NAMESPACE" \
              SSL_CERT_FILE=/etc/ssl/certs/openshift-service-ca/service-ca.crt
          else
            echo "  SSL_CERT_FILE already set, skipping"
          fi

          echo "Step 6: Wait for Authorino rollout..."
          oc rollout status deploy/authorino -n "$NAMESPACE" --timeout=120s

          echo "Authorino TLS setup complete."
{{- end }}
