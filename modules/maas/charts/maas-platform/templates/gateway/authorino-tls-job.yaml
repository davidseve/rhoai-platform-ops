{{- if and .Values.kuadrant.enabled .Values.kuadrant.authorinoTls.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
- apiGroups: ["operator.authorino.kuadrant.io"]
  resources: ["authorinos"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authorino-tls-setup
subjects:
- kind: ServiceAccount
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authorino-tls-gateway
  namespace: {{ .Values.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways"]
  verbs: ["get", "patch"]
- apiGroups: ["networking.istio.io"]
  resources: ["envoyfilters"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authorino-tls-gateway
  namespace: {{ .Values.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authorino-tls-gateway
subjects:
- kind: ServiceAccount
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authorino-tls-setup
  namespace: {{ .Values.kuadrant.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: authorino-tls-setup
      restartPolicy: OnFailure
      containers:
      - name: setup
        image: {{ .Values.hookImage | default "image-registry.openshift-image-registry.svc:5000/openshift/cli:latest" }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          NS="{{ .Values.kuadrant.namespace }}"
          GW_NS="{{ .Values.gateway.namespace }}"
          GW_NAME="{{ .Values.gateway.name }}"

          # --- Listener TLS (Gateway → Authorino) ---

          echo "Step 1/6: Annotate Authorino service for serving cert..."
          oc annotate service authorino-authorino-authorization -n "$NS" \
            service.beta.openshift.io/serving-cert-secret-name=authorino-server-cert \
            --overwrite

          echo "Step 2/6: Wait for cert secret..."
          for i in $(seq 1 30); do
            oc get secret authorino-server-cert -n "$NS" &>/dev/null && break
            sleep 2
          done
          oc get secret authorino-server-cert -n "$NS" || { echo "FATAL: cert secret not created"; exit 1; }

          echo "Step 3/6: Enable listener TLS on Authorino CR..."
          oc patch authorino authorino -n "$NS" --type=merge -p '{
            "spec":{"listener":{"tls":{"enabled":true,"certSecretRef":{"name":"authorino-server-cert"}}}}
          }'

          # --- Outbound CA trust (Authorino → maas-api) ---

          echo "Step 4/6: Ensure service-ca ConfigMap and mount..."
          if ! oc get configmap openshift-service-ca.crt -n "$NS" &>/dev/null; then
            oc create configmap openshift-service-ca.crt -n "$NS"
          fi
          oc annotate configmap openshift-service-ca.crt -n "$NS" \
            service.beta.openshift.io/inject-cabundle=true --overwrite

          HAS_VOL=$(oc get deploy authorino -n "$NS" \
            -o jsonpath='{.spec.template.spec.volumes[?(@.name=="openshift-service-ca")].name}' 2>/dev/null)
          if [ -z "$HAS_VOL" ]; then
            oc set volume deploy/authorino -n "$NS" --add \
              --name=openshift-service-ca \
              --type=configmap \
              --configmap-name=openshift-service-ca.crt \
              --mount-path=/etc/ssl/certs/openshift-service-ca \
              --read-only
          fi

          echo "Step 5/6: Set SSL_CERT_FILE and wait for rollout..."
          oc set env deploy/authorino -n "$NS" \
            SSL_CERT_FILE=/etc/ssl/certs/openshift-service-ca/service-ca.crt
          oc rollout status deploy/authorino -n "$NS" --timeout=120s

          # --- Gateway EnvoyFilter ---

          echo "Step 6/6: Ensure Gateway EnvoyFilter for TLS..."
          if ! oc get envoyfilter "${GW_NAME}-authn-ssl" -n "$GW_NS" &>/dev/null; then
            oc annotate gateway "$GW_NAME" -n "$GW_NS" \
              security.opendatahub.io/authorino-tls-bootstrap- 2>/dev/null || true
            sleep 3
            oc annotate gateway "$GW_NAME" -n "$GW_NS" \
              security.opendatahub.io/authorino-tls-bootstrap="true" --overwrite
            for i in $(seq 1 30); do
              oc get envoyfilter "${GW_NAME}-authn-ssl" -n "$GW_NS" &>/dev/null && break
              sleep 2
            done
            oc get envoyfilter "${GW_NAME}-authn-ssl" -n "$GW_NS" || echo "WARNING: EnvoyFilter not created"
          fi

          echo "Authorino TLS setup complete."
{{- end }}
