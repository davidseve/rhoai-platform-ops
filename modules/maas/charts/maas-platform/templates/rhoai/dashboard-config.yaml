{{- if (ne (.Values.dashboard.crEnabled | toString) "false") }}
apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  name: odh-dashboard-config
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  dashboardConfig:
    genAiStudio: {{ .Values.dashboard.genAiStudio }}
    modelAsService: {{ .Values.dashboard.modelAsService }}
    maasAuthPolicies: {{ .Values.dashboard.maasAuthPolicies | default false }}
    vLLMDeploymentOnMaaS: {{ .Values.dashboard.vLLMDeploymentOnMaaS | default false }}
    observabilityDashboard: {{ .Values.dashboard.observabilityDashboard | default false }}
    mlflow: {{ .Values.dashboard.mlflow | default false }}
    disableLMEval: {{ .Values.dashboard.disableLMEval | default false }}
    disablePerformanceMetrics: {{ .Values.dashboard.disablePerformanceMetrics | default false }}
    disableModelCatalog: {{ .Values.dashboard.disableModelCatalog | default false }}
    disableModelRegistry: {{ .Values.dashboard.disableModelRegistry | default false }}
    disableLLMd: {{ .Values.dashboard.disableLLMd | default false }}
{{- end }}
