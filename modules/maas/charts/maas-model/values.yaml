global:
  name: tinyllama-test
  namespace: models-as-a-service

# RHOAI 3.4 GA: maas-controller creates the models-as-a-service namespace.
# With ArgoCD, set to false (ArgoCD uses CreateNamespace=true in syncPolicy).
# Helm models chart runs after platform, so namespace already exists.
namespace:
  create: false

model:
  storageUri: "oci://quay.io/rh-aiservices-bu/tinyllama:1.0"
  servedName: "tinyllama-test"
  maxModelLen: 2048

images:
  vllm:
    # CPU (no tracing): quay.io/rh-aiservices-bu/vllm-cpu-openai-ubi9:0.3
    # CPU (with OTel):  build with `make build-vllm-cpu-otel`, then set tag to 0.3-otel
    # GPU:              quay.io/modh/vllm:rhoai-2.20-cuda (default llm-d image)
    repository: "quay.io/dseveria/vllm-cpu-openai-ubi9"
    tag: "0.3-otel"

resources:
  requests:
    cpu: "2"
    memory: "6Gi"
  limits:
    cpu: "8"
    memory: "12Gi"

llminferenceservice:
  replicas: 1
  gateway:
    name: maas-default-gateway
    namespace: openshift-ingress

tracing:
  enabled: true
  detailed: false   # token-level spans (higher overhead, requires enabled: true)
  otlpEndpoint: "http://maas-collector-collector.observability.svc:4317"
  serviceName: ""   # defaults to model servedName

# Model Registry: registers the model in RHOAI Model Registry via REST API Job.
# Creates RegisteredModel + ModelVersion + ModelArtifact (idempotent).
registry:
  enabled: true

# MaaSModelRef: registers the model in the MaaS catalog (/v1/models).
modelRef:
  enabled: true
  displayName: "TinyLlama 1.1B Test"
  description: "CPU-only TinyLlama for development and testing"
  useCase: "chat"

# MaaSAuthPolicy: enables API key authentication for this model.
# Groups are derived automatically from subscription.tiers — do NOT define groups here.
# Only define individual users if needed (authPolicy.subjects.users).
authPolicy:
  enabled: true
  subjects: {}

# MaaSSubscription: creates per-tier MaaSSubscription CRs.
# The maas-controller watches these and creates TokenRateLimitPolicy automatically.
# Groups must be Kubernetes groups (from TokenReview), not OpenShift Groups.
subscription:
  enabled: true
  tiers:
    free:
      groups:
        - name: cluster-admins
      tokenRateLimits:
        # Low limit enables E2E rate-limit testing on CPU inference
        - limit: 500
          window: "1m"
    premium:
      priority: 10
      groups:
        - name: cluster-admins
      tokenRateLimits:
        - limit: 50000
          window: "1m"
