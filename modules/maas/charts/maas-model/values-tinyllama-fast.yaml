global:
  name: tinyllama-fast
  namespace: models-as-a-service

mode: llminferenceservice

namespace:
  create: false

model:
  storageUri: "oci://quay.io/rh-aiservices-bu/tinyllama:1.0"
  servedName: "tinyllama-fast"
  maxModelLen: 2048

images:
  vllm:
    repository: "quay.io/dseveria/vllm-cpu-openai-ubi9"
    tag: "0.3-otel"

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "8"
    memory: "8Gi"

llminferenceservice:
  replicas: 1
  gateway:
    name: maas-default-gateway
    namespace: openshift-ingress

rbac:
  enabled: true

tiers:
  free: {}
  premium: {}

subscription:
  enabled: true
  tiers:
    free:
      groups:
        - name: system:authenticated
      tokenRateLimits:
        - limit: 10000
          window: "1m"
    premium:
      priority: 10
      groups:
        - name: tier-premium-users
      tokenRateLimits:
        - limit: 100000
          window: "1m"
