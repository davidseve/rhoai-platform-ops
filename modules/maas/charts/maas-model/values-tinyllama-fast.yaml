global:
  name: tinyllama-fast
  namespace: models-as-a-service

namespace:
  create: false

model:
  storageUri: "oci://quay.io/rh-aiservices-bu/tinyllama:1.0"
  servedName: "tinyllama-fast"
  maxModelLen: 2048

images:
  vllm:
    repository: "quay.io/dseveria/vllm-cpu-openai-ubi9"
    tag: "0.3-otel"

resources:
  requests:
    cpu: "2"
    memory: "6Gi"
  limits:
    cpu: "8"
    memory: "12Gi"

llminferenceservice:
  replicas: 1
  gateway:
    name: maas-default-gateway
    namespace: openshift-ingress

# MaaSModelRef: registers the model in the MaaS catalog (/v1/models).
modelRef:
  enabled: true
  displayName: "TinyLlama 1.1B Fast"
  description: "CPU-only TinyLlama with higher rate limits for testing"
  useCase: "chat"

rbac:
  enabled: true

# Groups are derived automatically from subscription.tiers.
authPolicy:
  enabled: true
  subjects: {}

subscription:
  enabled: true
  tiers:
    free:
      groups:
        - name: cluster-admins
      tokenRateLimits:
        - limit: 10000
          window: "1m"
    premium:
      priority: 10
      groups:
        - name: cluster-admins
      tokenRateLimits:
        - limit: 100000
          window: "1m"
