{{- if .Values.gpu.enabled }}
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: {{ .Values.global.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
    monitoring.opendatahub.io/scrape: "true"
  annotations:
    security.opendatahub.io/enable-auth: "true"
spec:
  model:
    name: {{ .Values.model.servedName }}
    uri: {{ .Values.model.storageUri }}
  replicas: {{ .Values.llminferenceservice.replicas }}
  router:
    gateway:
      refs:
      - name: {{ .Values.llminferenceservice.gateway.name }}
        namespace: {{ .Values.llminferenceservice.gateway.namespace }}
    route: {}
  template:
    containers:
    - name: main
      image: {{ .Values.gpu.image.repository }}:{{ .Values.gpu.image.tag }}
      command:
      {{- range .Values.gpu.command }}
      - {{ . }}
      {{- end }}
      args:
      - --port
      - "8000"
      - --max-model-len
      - {{ .Values.model.maxModelLen | quote }}
      - --served-model-name
      - {{ .Values.model.servedName }}
      - --ssl-certfile
      - /var/run/kserve/tls/tls.crt
      - --ssl-keyfile
      - /var/run/kserve/tls/tls.key
      {{- range .Values.gpu.extraArgs }}
      - {{ . | quote }}
      {{- end }}
      {{- if .Values.tracing.enabled }}
      - --otlp-traces-endpoint
      - {{ .Values.tracing.otlpEndpoint | quote }}
      {{- if .Values.tracing.detailed }}
      - --collect-detailed-traces
      - request
      {{- end }}
      {{- end }}
      {{- if or .Values.gpu.env .Values.tracing.enabled }}
      env:
      {{- range .Values.gpu.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
      {{- end }}
      {{- if .Values.tracing.enabled }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.tracing.serviceName | default .Values.model.servedName | quote }}
      {{- end }}
      {{- end }}
      {{- if .Values.gpu.shm }}
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
      {{- end }}
      resources:
        limits:
          cpu: {{ .Values.gpu.resources.limits.cpu | quote }}
          memory: {{ .Values.gpu.resources.limits.memory | quote }}
          nvidia.com/gpu: {{ .Values.gpu.resources.limits.gpu | quote }}
        requests:
          cpu: {{ .Values.gpu.resources.requests.cpu | quote }}
          memory: {{ .Values.gpu.resources.requests.memory | quote }}
          nvidia.com/gpu: {{ .Values.gpu.resources.requests.gpu | quote }}
    {{- if .Values.gpu.shm }}
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: {{ .Values.gpu.shm.size | default "16Gi" }}
    {{- end }}
    {{- with .Values.gpu.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.gpu.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
