{{- if .Values.authPolicy.enabled }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ .Values.global.name }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  modelRefs:
    - name: {{ .Values.global.name }}
      namespace: {{ .Values.global.namespace }}
  subjects:
    groups:
      {{- $seen := dict }}
      {{- range $tierName, $tier := .Values.subscription.tiers }}
      {{- range $tier.groups }}
      {{- if not (hasKey $seen .name) }}
      {{- $_ := set $seen .name true }}
      - name: {{ .name }}
      {{- end }}
      {{- end }}
      {{- end }}
    {{- if .Values.authPolicy.subjects.users }}
    users:
      {{- toYaml .Values.authPolicy.subjects.users | nindent 6 }}
    {{- end }}
{{- end }}
