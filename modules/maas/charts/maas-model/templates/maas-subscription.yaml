{{- if .Values.subscription.enabled }}
{{- range $tierName, $tier := .Values.subscription.tiers }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ $.Values.global.name }}-{{ $tierName }}
  namespace: {{ $.Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    groups:
      {{- range $tier.groups }}
      - name: {{ .name }}
      {{- end }}
  {{- if $tier.priority }}
  priority: {{ $tier.priority }}
  {{- end }}
  modelRefs:
    - name: {{ $.Values.global.name }}
      namespace: {{ $.Values.global.namespace }}
      {{- if $tier.tokenRateLimits }}
      tokenRateLimits:
        {{- range $tier.tokenRateLimits }}
        - limit: {{ .limit }}
          window: {{ .window | quote }}
        {{- end }}
      {{- end }}
---
{{- end }}
{{- end }}
