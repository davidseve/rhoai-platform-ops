# Namespace where maas-api runs (must match RHOAI applicationsNamespace)
namespace: redhat-ods-applications

image:
  repository: registry.redhat.io/rhel9/postgresql-16
  tag: latest

# Database credentials -- replace with a Secret reference in production
database:
  name: maas
  user: maas
  password: maas-eval-password

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
