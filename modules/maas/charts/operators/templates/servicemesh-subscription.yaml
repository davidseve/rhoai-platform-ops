{{- if .Values.connectivityLink.enabled }}
# OLM creates servicemeshoperator3 as a dependency of RHCL with Manual approval.
# This blocks RHCL InstallPlan approval on every fresh install. Creating the
# Subscription explicitly with Automatic prevents the issue.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-operators
spec:
  name: servicemeshoperator3
  channel: stable
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
{{- end }}
