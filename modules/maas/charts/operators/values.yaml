rhoai:
  enabled: true
  namespace: redhat-ods-operator
  channel: stable-3.4
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # Testing latest 3.4.x (3.4.2 currently in catalog) to validate
  # COO regressions are fixed. Remove startingCSV to get latest available.
  installPlanApproval: Automatic

connectivityLink:
  enabled: true
  # Dedicated namespace avoids InstallPlan Manual approval contamination
  # from servicemeshoperator3 in openshift-operators
  namespace: redhat-connectivity-link
  channel: stable
  package: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # Catalog no longer ships 1.3.x on fresh clusters (only 1.4.x).
  # Prefer 1.4.3 over a dead pin; known risk: allow_on_headers_stop_iteration
  # vs Envoy 1.34.x (ADR-0014) — GET auth may fail; POST inference usually works.
  startingCSV: rhcl-operator.v1.4.3
  installPlanApproval: Automatic

kuadrant:
  # Namespace for Kuadrant CR and Limitador (not the operator subscription)
  namespace: kuadrant-system

certManager:
  enabled: false

leaderWorkerSet:
  enabled: true
  namespace: leader-worker-set
  channel: stable-v1.0
  source: redhat-operators
  sourceNamespace: openshift-marketplace
