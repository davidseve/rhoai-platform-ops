rhoai:
  enabled: true
  namespace: redhat-ods-operator
  channel: stable-3.4
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # Testing 3.4.1 to validate COO regressions are fixed.
  # Revert to 3.4.0 if regressions persist.
  startingCSV: rhods-operator.3.4.1
  installPlanApproval: Manual

connectivityLink:
  enabled: true
  # Dedicated namespace avoids InstallPlan Manual approval contamination
  # from servicemeshoperator3 in openshift-operators
  namespace: redhat-connectivity-link
  channel: stable
  package: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # Pin to 1.3.4 — RHCL 1.4.0 adds allow_on_headers_stop_iteration to the
  # Wasm plugin config, which Envoy 1.34.x (Service Mesh 3.3.x) does not
  # recognize, causing headers (incl. Authorization) to not be forwarded
  # to Authorino. Remove startingCSV and set Automatic to upgrade.
  startingCSV: rhcl-operator.v1.3.4
  installPlanApproval: Manual

kuadrant:
  # Namespace for Kuadrant CR and Limitador (not the operator subscription)
  namespace: kuadrant-system

certManager:
  enabled: false

leaderWorkerSet:
  enabled: true
  namespace: leader-worker-set
  channel: stable-v1.0
  source: redhat-operators
  sourceNamespace: openshift-marketplace
