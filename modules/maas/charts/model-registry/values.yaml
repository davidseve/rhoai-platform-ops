global:
  name: model-registry
  namespace: rhoai-model-registries

# PostgreSQL backend — reuses the maas-db instance in redhat-ods-applications.
# Dedicated database to avoid migration conflicts with MLflow/MaaS tables.
postgresql:
  host: maas-db.redhat-ods-applications.svc
  port: 5432
  database: model_registry
  username: maas
  password: maas-eval-password

# ModelRegistry CR configuration
# Ref: https://github.com/opendatahub-io/model-registry-operator
modelRegistry:
  name: maas-model-registry
  rest:
    port: 8080
    # disabled: Dashboard accesses via internal proxy, no external Route
    serviceRoute: disabled
  grpc:
    port: 9090
  postgres:
    # Database "model_registry" already created — skip creation, only run migrations
    skipDBCreation: true
    # Internal cluster communication (pod-to-pod via ClusterIP Service)
    # TLS for shared PostgreSQL is tracked as a cross-cutting future task
    sslMode: disable
