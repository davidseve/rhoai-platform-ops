# Evaluation PostgreSQL for RHOAI 3.4 maas-api.
# The maas-api component requires a PostgreSQL database to store API keys
# and subscription data. It reads the connection URL from a Secret named
# maas-db-config (key: DB_CONNECTION_URL) in the same namespace.
#
# For production, replace with a managed PostgreSQL service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-db
  labels:
    app: maas-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-db
  template:
    metadata:
      labels:
        app: maas-db
    spec:
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-16:latest
        env:
        - name: POSTGRESQL_USER
          value: maas
        - name: POSTGRESQL_PASSWORD
          value: maas-eval-password
        - name: POSTGRESQL_DATABASE
          value: maas
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: maas-db
  labels:
    app: maas-db
spec:
  selector:
    app: maas-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-config
type: Opaque
stringData:
  DB_CONNECTION_URL: "postgres://maas:maas-eval-password@maas-db.redhat-ods-applications.svc:5432/maas?sslmode=disable"
