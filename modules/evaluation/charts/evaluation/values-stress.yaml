# Stress scenario: sweep profile to find max throughput and breaking point
# Usage: make run-benchmark BENCHMARK_SCENARIO=stress

benchmarks:
  job:
    enabled: true
    resources:
      requests:
        cpu: "2"
        memory: "2Gi"
      limits:
        cpu: "4"
        memory: "4Gi"

  benchmark:
    profile: "sweep"
    # For sweep profile, rate = number of auto-discovered rate points (sweep_size >= 2)
    rates:
      - "5"
    maxSeconds: 120
    promptTokens: 32
    outputTokens: 64
