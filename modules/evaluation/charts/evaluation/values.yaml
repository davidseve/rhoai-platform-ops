global:
  name: evaluation
  namespace: evaluation

# Namespace for evaluation resources
namespace:
  enabled: true

# PostgreSQL backend — reuses the maas-db instance in redhat-ods-applications.
# Each consumer gets its own database for schema isolation (see extraDatabases
# in modules/database/charts/database/values.yaml).
# DNS fix: mlflow-dns-fix.yaml adds a NetworkPolicy allowing port 5353 egress
# to work around opendatahub-io/mlflow-operator#112 (fix merged, not released).
postgresql:
  host: maas-db.redhat-ods-applications.svc
  port: 5432
  user: maas
  password: maas-eval-password
  # Dedicated databases per consumer (created by database chart extraDatabases)
  mlflowDatabase: mlflow
  evalhubDatabase: evalhub

# MLflow Tracking Server (cluster-scoped CR; operator deploys to redhat-ods-applications)
mlflow:
  enabled: true
  name: mlflow
  replicas: 1
  # Serve artifacts via MLflow REST API
  serveArtifacts: true
  artifactsDestination: "file:///mlflow/artifacts"
  storage:
    size: 10Gi
  # Route for MLflow UI (created in redhat-ods-applications)
  route:
    enabled: true

# EvalHub evaluation control plane.
# Deployed in "evaluation" namespace (same as MLflow workspace) for simplicity.
# The RHOAI dashboard Evaluations page requires the CR in redhat-ods-applications,
# but that creates cross-namespace complexity with MLflow (which rejects its own
# namespace as a workspace). We prioritize a working pipeline over dashboard UI.
# Tracked upstream: https://redhat.atlassian.net/browse/RHOAIENG-66068
# RFE: https://redhat.atlassian.net/browse/RHAIRFE-2289
# GA review: when EvalHub moves to GA, re-test dashboard integration with a
# dedicated namespace — the sidecar may support cross-namespace discovery.
evalhub:
  enabled: true
  name: evalhub
  namespace: evaluation
  replicas: 1
  # Database backend for EvalHub (postgresql requires evalhub-db Secret)
  database:
    type: postgresql
    secret: evalhub-db
  # Model auth Secret (created by post-install hook with service-serving CA)
  modelAuth:
    secretName: model-auth
  # Providers to mount from OOTB ConfigMaps
  providers:
    - lm-evaluation-harness
    - guidellm
    - garak
    - lighteval
  # Collections to mount from OOTB ConfigMaps
  collections:
    - leaderboard-v2
  # OpenTelemetry (integrates with existing observability stack)
  otel:
    enabled: false

# Image with oc/kubectl CLI for hook Jobs (model-auth-init)
hookImage: registry.redhat.io/openshift4/ose-cli-rhel9:latest
