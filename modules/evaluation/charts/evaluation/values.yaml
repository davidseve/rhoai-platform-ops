global:
  name: evaluation
  namespace: evaluation

# Namespace for evaluation resources
namespace:
  enabled: true

# PostgreSQL backend — reuses the maas-db instance in redhat-ods-applications.
# MLflow and EvalHub create their own tables in the shared database.
# WORKAROUND: uses ClusterIP instead of hostname because the MLflow container
# image (RHOAI 3.4 EA2) cannot resolve Kubernetes service DNS names.
# Review at GA: switch back to maas-db.redhat-ods-applications.svc
postgresql:
  # CHANGE_ME: run `oc get svc maas-db -n redhat-ods-applications -o jsonpath='{.spec.clusterIP}'`
  host: 172.30.253.196
  port: 5432
  user: maas
  password: maas-eval-password
  database: maas

# MLflow Tracking Server (cluster-scoped CR; operator deploys to redhat-ods-applications)
mlflow:
  enabled: true
  name: mlflow
  replicas: 1
  # Serve artifacts via MLflow REST API
  serveArtifacts: true
  artifactsDestination: "file:///mlflow/artifacts"
  storage:
    size: 10Gi
  # Route for MLflow UI (created in redhat-ods-applications)
  route:
    enabled: true

# EvalHub evaluation control plane
evalhub:
  enabled: true
  name: evalhub
  replicas: 1
  # Providers to mount from OOTB ConfigMaps
  providers:
    - lm-evaluation-harness
    - guidellm
    - garak
    - lighteval
  # Collections to mount from OOTB ConfigMaps
  collections:
    - leaderboard-v2
  # OpenTelemetry (integrates with existing observability stack)
  otel:
    enabled: false

# LMEvalJob on-demand evaluation (not deployed by ArgoCD, used via helm template + oc create)
lmeval:
  enabled: false
  # Model endpoint (vLLM/KServe internal URL)
  model: tinyllama
  modelUrl: "https://tinyllama-test-predictor-models-as-a-service.apps.ocp.sandbox2106.opentlc.com/v1/completions"
  # Evaluation task (lm-evaluation-harness task name)
  task: arc_easy
  # Number of samples (set low for testing)
  limit: "10"
  numConcurrent: "1"
  # Model type: local-completions (loglikelihood) or local-chat-completions (generation)
  modelType: local-completions
  # Allow online access for HuggingFace downloads
  allowOnline: true

# Combined CA bundle (system root CAs + OpenShift service-serving CA)
# WORKAROUND for RHOAI 3.4 EA2: LMEvalJob pods need both system root CAs
# (for HuggingFace downloads) and OpenShift service-serving CA (for vLLM/KServe
# internal TLS). Neither ConfigMap alone is sufficient.
# Review at GA: the operator may handle this automatically.
caBundle:
  enabled: true
  name: combined-ca-bundle
  # Image with oc/kubectl CLI for the init Job
  image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
