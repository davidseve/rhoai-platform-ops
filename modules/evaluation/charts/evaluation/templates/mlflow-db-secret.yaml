{{- if .Values.mlflow.enabled }}
# Secret in redhat-ods-applications for MLflow backend store URI.
# Uses ClusterIP instead of hostname as workaround for DNS resolution issue
# in the MLflow container image (RHOAI 3.4 EA2).
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db-config
  namespace: redhat-ods-applications
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
type: Opaque
stringData:
  db-url: "postgresql://{{ .Values.postgresql.user }}:{{ .Values.postgresql.password }}@{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}?sslmode=disable"
{{- end }}
