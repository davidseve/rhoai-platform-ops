{{- if .Values.evalhub.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: evalhub-db
  namespace: {{ .Values.evalhub.namespace }}
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-url: "postgresql://{{ .Values.postgresql.user }}:{{ .Values.postgresql.password }}@{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.evalhubDatabase }}?sslmode=disable"
{{- end }}
