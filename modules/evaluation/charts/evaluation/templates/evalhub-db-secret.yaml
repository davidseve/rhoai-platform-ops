{{- if .Values.evalhub.enabled }}
# EvalHub needs the db-url Secret in its own namespace (evaluation).
# MLflow uses maas-db-config directly from redhat-ods-applications.
apiVersion: v1
kind: Secret
metadata:
  name: evalhub-db
  namespace: {{ include "evaluation.namespace" . }}
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-url: "postgresql://{{ .Values.postgresql.user }}:{{ .Values.postgresql.password }}@{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.evalhubDatabase }}?sslmode=disable"
{{- end }}
