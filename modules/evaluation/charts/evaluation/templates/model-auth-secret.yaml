{{- if .Values.evalhub.enabled }}
# Post-install hook: creates model-auth Secret with the OpenShift service-serving CA.
# EvalHub pods use model.auth.secret_ref to trust internal KServe TLS endpoints.
# The CA is read from the openshift-service-ca.crt ConfigMap (auto-created by OpenShift).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-auth-init
  namespace: {{ .Values.evalhub.namespace }}
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-auth-init
  namespace: {{ .Values.evalhub.namespace }}
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-auth-init
  namespace: {{ .Values.evalhub.namespace }}
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: model-auth-init
    namespace: {{ .Values.evalhub.namespace }}
roleRef:
  kind: Role
  name: model-auth-init
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-auth-init
  namespace: {{ .Values.evalhub.namespace }}
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "evaluation.labels" . | nindent 8 }}
    spec:
      serviceAccountName: model-auth-init
      restartPolicy: Never
      containers:
        - name: create-secret
          image: {{ .Values.hookImage }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              NAMESPACE={{ .Values.evalhub.namespace }}
              SECRET_NAME={{ .Values.evalhub.modelAuth.secretName }}

              echo "Waiting for openshift-service-ca.crt ConfigMap..."
              until oc get configmap openshift-service-ca.crt -n "$NAMESPACE" 2>/dev/null; do
                sleep 5
              done

              echo "Creating/updating Secret $SECRET_NAME with service-serving CA..."
              oc create secret generic "$SECRET_NAME" \
                --from-literal=ca_cert="$(oc get cm openshift-service-ca.crt -n "$NAMESPACE" \
                    -o jsonpath='{.data.service-ca\.crt}')" \
                -n "$NAMESPACE" \
                --dry-run=client -o yaml | oc apply -f -

              echo "Secret $SECRET_NAME created successfully."
{{- end }}
