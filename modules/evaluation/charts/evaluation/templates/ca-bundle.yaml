{{- if .Values.caBundle.enabled }}
# ============================================================================
# WORKAROUND: Combined CA Bundle for LMEvalJob pods
# ============================================================================
# Problem: LMEvalJob pods need to verify TLS for two different CA chains:
#   1. Public root CAs → HuggingFace Hub (dataset/tokenizer downloads)
#   2. OpenShift service-serving CA → vLLM/KServe internal endpoints
#
# Python's REQUESTS_CA_BUNDLE only accepts a single file, so we must
# concatenate both bundles. This Job runs post-install to combine:
#   - odh-trusted-ca-bundle/ca-bundle.crt (system root CAs, injected by ODH)
#   - openshift-service-ca.crt/service-ca.crt (service-serving CA, injected by OCP)
#
# Affected version: RHOAI 3.4.0-ea.2
# Review at GA: check if the TrustyAI operator handles CA injection natively
#   for LMEvalJob pods (similar to MLflow's caBundleConfigMap field).
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ca-bundle-init
  namespace: {{ include "evaluation.namespace" . }}
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ca-bundle-init
  namespace: {{ include "evaluation.namespace" . }}
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ca-bundle-init
  namespace: {{ include "evaluation.namespace" . }}
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: ca-bundle-init
    namespace: {{ include "evaluation.namespace" . }}
roleRef:
  kind: Role
  name: ca-bundle-init
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ca-bundle-init
  namespace: {{ include "evaluation.namespace" . }}
  labels:
    {{- include "evaluation.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "evaluation.labels" . | nindent 8 }}
    spec:
      serviceAccountName: ca-bundle-init
      restartPolicy: Never
      containers:
        - name: combine-certs
          image: {{ .Values.caBundle.image }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              NAMESPACE={{ include "evaluation.namespace" . }}
              CM_NAME={{ include "evaluation.ca-bundle-name" . }}

              echo "Waiting for odh-trusted-ca-bundle..."
              until oc get configmap odh-trusted-ca-bundle -n "$NAMESPACE" 2>/dev/null; do
                sleep 5
              done

              echo "Waiting for openshift-service-ca.crt..."
              until oc get configmap openshift-service-ca.crt -n "$NAMESPACE" 2>/dev/null; do
                sleep 5
              done

              oc get configmap odh-trusted-ca-bundle -n "$NAMESPACE" \
                -o jsonpath='{.data.ca-bundle\.crt}' > /tmp/combined.crt
              oc get configmap openshift-service-ca.crt -n "$NAMESPACE" \
                -o jsonpath='{.data.service-ca\.crt}' >> /tmp/combined.crt

              oc create configmap "$CM_NAME" \
                --from-file=ca-bundle.crt=/tmp/combined.crt \
                -n "$NAMESPACE" \
                --dry-run=client -o yaml | oc apply -f -

              echo "Combined CA bundle created: $CM_NAME"
{{- end }}
