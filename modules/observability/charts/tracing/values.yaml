# When coo.enabled=true, TempoMonolithic is NOT deployed (RHOAI manages Tempo
# in redhat-ods-monitoring). The OTel Collector redirects to the RHOAI Tempo
# endpoint instead. See ADR-0013.
coo:
  enabled: false
  # RHOAI Tempo OTLP gRPC endpoint (verified on cluster: the gateway service
  # exposes both OTLP :4317 and query :3200)
  tempoEndpoint: "tempo-data-science-tempomonolithic-gateway.redhat-ods-monitoring.svc:4317"
  tempoTenant: "redhat-ods-monitoring"

tempo:
  name: tempo
  namespace: observability
  storage:
    backend: pv           # "memory" for dev/test, "pv" for persistent
    size: 10Gi
  retention: 48h
  ingestion:
    otlp:
      grpc: true
      http: true

collector:
  name: maas-collector
  namespace: observability
  tempoEndpoint: "tempo-tempo:4317"
  metricsPort: 8889
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

serviceMonitor:
  enabled: true

# Trace-based SLO alerts (PrometheusRule from spanmetrics-derived metrics)
alerting:
  enabled: true
  # P99 span duration threshold in seconds
  p99LatencyThreshold: 10
  # Error ratio threshold (0.05 = 5%)
  errorRateThreshold: 0.05
