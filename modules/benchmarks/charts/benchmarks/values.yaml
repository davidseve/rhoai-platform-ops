global:
  name: benchmarks
  namespace: benchmarks

namespace:
  create: true

# Results storage
pvc:
  storageSize: 5Gi
  # Leave empty to use cluster default StorageClass
  storageClassName: ""

# Job configuration -- disabled by default (ArgoCD deploys infra only)
job:
  enabled: false
  image: ghcr.io/vllm-project/guidellm:v0.6.0
  backoffLimit: 0
  # Auto-delete completed Job after 24h
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

# Benchmark parameters
benchmark:
  # Target endpoint (gateway route by default)
  target: "https://maas.apps.CHANGE_ME/v1"
  model: "tinyllama-test"
  # HuggingFace model ID for tokenizer (needed for synthetic data generation)
  processor: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  requestType: "chat_completions"
  # Load profile: concurrent | constant | poisson | sweep | synchronous
  profile: "concurrent"
  rates:
    - "1"
    - "2"
    - "4"
    - "8"
  maxSeconds: 60
  # Payload size (prompt/output tokens)
  promptTokens: 32
  outputTokens: 64
  # Output formats: json, csv, html, yaml
  outputs: "json,csv"
  warmup: "0.1"
  cooldown: "0.1"
  # TLS verification uses the cluster CA bundle (injected via ConfigMap)
  verifySSL: true
  # Auth: use authSecret (Secret name with key "token") or authToken (inline, dev only)
  authSecret: ""
  authToken: ""
  extraArgs: []
