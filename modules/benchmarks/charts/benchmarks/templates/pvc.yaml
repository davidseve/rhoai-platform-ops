apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "benchmarks.fullname" . }}-results
  namespace: {{ include "benchmarks.namespace" . }}
  labels:
    {{- include "benchmarks.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.storageSize }}
  {{- if .Values.pvc.storageClassName }}
  storageClassName: {{ .Values.pvc.storageClassName }}
  {{- end }}
